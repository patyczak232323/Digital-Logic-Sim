name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: [self-hosted, trusted]
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            label: Windows x64
            packageName: DLSRewired-Windows-x64
          - targetPlatform: StandaloneLinux64
            label: Linux x86_64
            packageName: DLSRewired-Linux-x86_64

    steps:
      - name: Restore workspace ownership
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Self-hosted workspaces persist between jobs; fix files left by an earlier Unity container.
          if [ -d "$GITHUB_WORKSPACE" ] && [ -n "$(ls -A "$GITHUB_WORKSPACE")" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: DLSRewired
          buildsPath: build

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          build_dir="build/${{ matrix.targetPlatform }}"
          if [ ! -d "$build_dir" ]; then
            echo "::error::Expected build directory not found: $build_dir"
            find build -maxdepth 3 -type f -print || true
            exit 1
          fi
          # tar keeps the Linux executable bit; the publish job turns it into the release zip.
          tar -C "$build_dir" -cf "$GITHUB_WORKSPACE/${{ matrix.packageName }}.tar" .

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.packageName }}
          path: ${{ matrix.packageName }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Restore workspace ownership
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Unity runs in Docker as root; hand its files back to the runner user.
          if [ -d "$GITHUB_WORKSPACE" ] && [ -n "$(ls -A "$GITHUB_WORKSPACE")" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

  build_android:
    name: Build Android ARM64 APK
    runs-on: [self-hosted, trusted]
    timeout-minutes: 60

    steps:
      - name: Restore workspace ownership
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Self-hosted workspaces persist between jobs; fix files left by an earlier Unity container.
          if [ -d "$GITHUB_WORKSPACE" ] && [ -n "$(ls -A "$GITHUB_WORKSPACE")" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: DLSRewired
          buildsPath: build

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Android APK not found"
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$apk" DLSRewired-Android-arm64.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-DLSRewired-Android-arm64
          path: DLSRewired-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7

      - name: Restore workspace ownership
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Unity runs in Docker as root; hand its files back to the runner user.
          if [ -d "$GITHUB_WORKSPACE" ] && [ -n "$(ls -A "$GITHUB_WORKSPACE")" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build_android]
    # Android is experimental: a failed APK build must not block the desktop release.
    if: ${{ !cancelled() && needs.build.result == 'success' }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: Docs

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Package desktop builds
        shell: bash
        run: |
          set -euo pipefail
          for archive in release-assets/*.tar; do
            name="$(basename "$archive" .tar)"
            mkdir -p "unpacked/$name"
            tar -xf "$archive" -C "unpacked/$name"
            (cd "unpacked/$name" && zip -qr "$GITHUB_WORKSPACE/release-assets/$name.zip" .)
            rm "$archive"
          done

      - name: Create release and upload files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes_file="Docs/RELEASE_${TAG#v}.md"
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          else
            echo "::warning::$notes_file not found; using generated release notes."
            notes_args=(--generate-notes)
          fi

          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --title "Rewired $TAG" \
              "${notes_args[@]}"
          fi

          assets=(
            release-assets/DLSRewired-Windows-x64.zip
            release-assets/DLSRewired-Linux-x86_64.zip
          )
          if [ -f release-assets/DLSRewired-Android-arm64.apk ]; then
            assets+=(release-assets/DLSRewired-Android-arm64.apk)
          else
            echo "::warning::Android APK was not built; publishing desktop builds only."
          fi

          gh release upload "$TAG" "${assets[@]}" \
            --repo "$REPOSITORY" \
            --clobber
