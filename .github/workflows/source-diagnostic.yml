name: Unity source diagnostic

on:
  push:
    branches: [ fix/unity-engine-compatibility ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile simulation subsystem with Roslyn
        run: dotnet build Tools/CompileAudit/SimulationCompileAudit.csproj --configuration Release --nologo
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dls-source-snapshot
          path: |
            Assets
            Packages
            ProjectSettings
          if-no-files-found: error
          retention-days: 1
