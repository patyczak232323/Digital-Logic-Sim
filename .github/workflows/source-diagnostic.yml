name: Unity source diagnostic

on:
  push:
    branches: [ fix/unity-engine-compatibility ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch engine numeric type mismatches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('Assets/Scripts/Simulation/Simulator.cs'): [
                  ('uint data = PinState.GetBitStates(pixelInputPin) & 1;',
                   'uint data = (uint)(PinState.GetBitStates(pixelInputPin) & 1);'),
                  ('chip.InternalState[GetAddress8Bit(addressPin)] = PinState.GetBitStates(dataPin) & Address8BitMask;',
                   'chip.InternalState[GetAddress8Bit(addressPin)] = (uint)(PinState.GetBitStates(dataPin) & Address8BitMask);'),
              ],
              Path('Assets/Scripts/Simulation/DeterministicSimulator.cs'): [
                  ('chip.InternalState[GetAddress8Bit(addressPin)] = PinState.GetBitStates(dataPin) & Address8BitMask;',
                   'chip.InternalState[GetAddress8Bit(addressPin)] = (uint)(PinState.GetBitStates(dataPin) & Address8BitMask);'),
                  ('chip.InternalState[addressIndex] = PinState.GetBitStates(pixelInputPin) & 1;',
                   'chip.InternalState[addressIndex] = (uint)(PinState.GetBitStates(pixelInputPin) & 1);'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'Expected source pattern not found in {path}: {old}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Compile simulation subsystem with Roslyn
        run: dotnet build Tools/CompileAudit/SimulationCompileAudit.csproj --configuration Release --nologo

      - name: Run deterministic regression suite
        run: python3 Tools/SimulationRegression/regression.py

      - name: Run program regression suite
        run: python3 Tools/ProgramRegression/regression.py

      - name: Commit verified engine compatibility fix
        run: |
          if git diff --quiet -- Assets/Scripts/Simulation/Simulator.cs Assets/Scripts/Simulation/DeterministicSimulator.cs; then
            echo "Engine compatibility fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Simulation/Simulator.cs Assets/Scripts/Simulation/DeterministicSimulator.cs
          git commit -m "Fix engine uint compile errors"
          git push

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dls-source-snapshot
          path: |
            Assets
            Packages
            ProjectSettings
          if-no-files-found: error
          retention-days: 1
