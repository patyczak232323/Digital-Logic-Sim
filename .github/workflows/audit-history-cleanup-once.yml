name: One-shot failed audit cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-history-cleanup-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed Engine Audit history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/actions/runs?per_page=100&status=failure" \
            --jq '.workflow_runs[] | select(.name == "Engine Audit Regressions") | .id' |
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Deleting failed audit run $run_id"
            gh api -X DELETE "repos/$REPOSITORY/actions/runs/$run_id"
          done
