name: Full simulation and computer regression

on:
  push:
    branches: [ main, 'fix/**', 'perf/**', 'exp/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    # Pull requests from forks stay on GitHub-hosted runners.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "trusted"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run deterministic propagation stress suite
        run: python3 Tools/SimulationRegression/regression.py

      - name: Run 8-bit computer behavioral suite
        run: python3 Tools/ComputerRegression/regression.py

      - name: Run whole-program regression suite
        run: python3 Tools/ProgramRegression/regression.py
