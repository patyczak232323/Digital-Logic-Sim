name: Simulation, computer, and program regression

on:
  push:
    branches: [ main, fix/deterministic-simulation-propagation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deterministic propagation regression suite
        run: python3 Tools/SimulationRegression/regression.py

      - name: Run 8-bit computer regression suite
        run: python3 Tools/ComputerRegression/regression.py

      - name: Build and execute generated 8-bit computer netlist
        run: |
          python3 Tools/ComputerProjectBuilder/build_project.py
          python3 Tools/ComputerProjectBuilder/verify_netlist.py

      - name: Run whole-program regression suite
        run: python3 Tools/ProgramRegression/regression.py
