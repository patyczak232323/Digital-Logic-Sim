name: Import upstream Digital Logic Sim

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop after upstream has already been imported
        id: guard
        shell: bash
        run: |
          if [ -f "Assets/Scripts/Simulation/Simulator.cs" ]; then
            echo "already_imported=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_imported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone Sebastian Lague upstream main
        if: steps.guard.outputs.already_imported != 'true'
        run: |
          git clone --depth 1 --branch main https://github.com/SebLague/Digital-Logic-Sim.git /tmp/upstream

      - name: Replace repository contents with upstream
        if: steps.guard.outputs.already_imported != 'true'
        run: |
          cp .github/workflows/import-upstream.yml /tmp/import-upstream.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/upstream/. .
          rm -rf .git
          mkdir -p .github/workflows
          cp /tmp/import-upstream.yml .github/workflows/import-upstream.yml

      - name: Commit imported upstream
        if: steps.guard.outputs.already_imported != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import SebLague/Digital-Logic-Sim main'
          git push origin HEAD:main
