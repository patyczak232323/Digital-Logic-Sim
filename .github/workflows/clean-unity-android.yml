name: Clean Unity Android build

on:
  push:
    branches:
      - rewrite/clean-architecture
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/clean-unity-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: RewiredNext
          buildsPath: build

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Android APK not found"
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$apk" RewiredNext-Android-arm64.apk
          ls -lh RewiredNext-Android-arm64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: RewiredNext-Android-arm64
          path: RewiredNext-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish to unofficial release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-unofficial"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rewired — Unofficial" \
              --prerelease \
              --notes "Experimental development builds of Rewired."
          fi

          gh release upload "$tag" RewiredNext-Android-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
